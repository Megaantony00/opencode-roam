<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>OpenCode Roam</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="stylesheet" href="/style.css?v=2" />
    <script src="/i18n.js?v=2" defer></script>
    <script src="/app.js?v=2" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot" id="dot"></span>
        <img class="brand-icon" src="/icon-192.png?v=2" alt="" width="28" height="28" />
        <strong>Roam</strong>
        <span class="badge" id="status" data-i18n="status.connecting">connecting…</span>
        <span class="version" id="version">—</span>
      </div>
      <div class="header-actions">
        <select id="sessions" data-i18n-aria-label="header.sessionAria" aria-label="Active session"></select>
        <button
          class="icon-button"
          id="settings-open"
          type="button"
          data-i18n-aria-label="header.settingsAria"
          data-i18n-title="header.settingsAria"
          aria-label="Settings"
          title="Settings"
        >
          ⚙
        </button>
      </div>
    </header>

    <div class="vpn-banner" id="vpn-banner" role="region" data-i18n-aria-label="vpn.title" aria-label="Connection lost" hidden>
      <div class="vpn-copy">
        <strong data-i18n="vpn.title">Connection lost</strong>
        <span data-i18n="vpn.message">Tailscale or the PC/bot is unreachable.</span>
      </div>
      <div class="vpn-actions">
        <a class="vpn-open" id="vpn-open" href="tailscale://navigate" data-i18n="vpn.open"
          >Open Tailscale</a
        >
        <button class="vpn-retry" id="vpn-retry" type="button" data-i18n="vpn.retry">Retry</button>
      </div>
    </div>

    <main id="chat" aria-live="polite"></main>

    <button id="quote-selection" class="quote-selection" type="button" data-i18n="quote.selection" hidden>
      ❝ Quote selection
    </button>

    <form id="composer">
      <div id="attachments" class="attachments" hidden></div>
      <div class="composer-row">
        <button
          id="attach"
          type="button"
          class="attach"
          data-i18n-title="composer.attachTitle"
          data-i18n-aria-label="composer.attach"
          title="Attach files"
          aria-label="Attach files"
        >
          <svg
            class="attach-svg"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M21.44 11.05l-8.49 8.49a6 6 0 0 1-8.49-8.49l8.49-8.49a4 4 0 0 1 5.66 5.66l-8.49 8.49a2 2 0 0 1-2.83-2.83l7.78-7.78"
            />
          </svg>
          <span class="attach-emoji" aria-hidden="true">📎</span>
        </button>
        <textarea
          id="input"
          rows="1"
          data-i18n-placeholder="composer.placeholder"
          placeholder="Message OpenCode…"
          autocomplete="off"
          enterkeyhint="send"
        ></textarea>
        <button id="send" type="submit" data-i18n="composer.send">Send</button>
      </div>
      <input id="files" type="file" multiple hidden />
    </form>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 id="settings-title" data-i18n="settings.title">Settings</h2>

        <label class="settings-field" for="language-select">
          <span data-i18n="settings.language">Language</span>
          <select id="language-select">
            <option value="system" data-i18n="settings.languageSystem">System default</option>
            <option value="it" data-i18n="settings.languageItalian">Italiano</option>
            <option value="en" data-i18n="settings.languageEnglish">English</option>
          </select>
        </label>

        <div class="settings-row">
          <span data-i18n="settings.version">Version</span>
          <span id="settings-version">—</span>
        </div>

        <button id="check-updates" type="button" class="settings-button" data-i18n="settings.checkUpdates">
          Check for updates
        </button>
        <p id="update-status" class="settings-status" role="status"></p>

        <a
          id="github-link"
          class="settings-link"
          href="https://github.com/Megaantony00/opencode-roam"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-aria-label="settings.openGitHub"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
            />
          </svg>
          <span data-i18n="settings.github">GitHub repository</span>
          <span class="settings-arrow" aria-hidden="true">↗</span>
        </a>

        <p class="settings-note" data-i18n="settings.languageNote">
          In the Android app, the language follows the app settings.
        </p>

        <button value="close" class="settings-close" data-i18n="settings.close">Close</button>
      </form>
    </dialog>
  </body>
</html>
