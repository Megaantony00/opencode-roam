<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Tailscale off — OpenCode Roam</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="stylesheet" href="/offline.css" />
    <script src="/i18n.js" defer></script>
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main class="offline">
      <img class="brand-icon" src="/icon-192.png" alt="" width="58" height="58" />
      <p class="eyebrow">OpenCode Roam</p>
      <h1 data-i18n="offline.title">Connection unavailable</h1>
      <p class="lead" data-i18n="offline.lead">
        Tailscale is off, or the PC/bot is powered off.
      </p>
      <p class="hint" data-i18n="offline.hint">
        Turn the VPN on, then come back: the app retries by itself.
      </p>

      <div class="actions">
        <a
          class="button primary"
          id="open-tailscale"
          href="tailscale://navigate"
          data-i18n="offline.openTailscale"
          >Open Tailscale</a
        >
        <button class="button" id="retry" type="button" data-i18n="offline.retry">Retry</button>
      </div>

      <p class="status" id="status" role="status" data-i18n="offline.checking">
        Checking connection…
      </p>
      <p class="footnote">
        <span data-i18n="offline.footnote1">If Tailscale is not installed,</span>
        <a
          href="https://play.google.com/store/apps/details?id=com.tailscale.ipn"
          data-i18n="offline.footnoteLink"
          >get it from the Play Store</a
        ><span data-i18n="offline.footnote2">. On iPhone, open the Tailscale app manually.</span>
      </p>
    </main>
  </body>
</html>
