<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Tailscale non attivo — OpenCode Roam</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="stylesheet" href="/offline.css" />
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main class="offline">
      <img class="brand-icon" src="/icon-192.png" alt="" width="58" height="58" />
      <p class="eyebrow">OpenCode Roam</p>
      <h1>Connessione non disponibile</h1>
      <p class="lead">
        Tailscale non è attivo, oppure il PC o il bot sono spenti.
      </p>
      <p class="hint">
        Attiva la VPN, poi torna qui: l’app riprova da sola.
      </p>

      <div class="actions">
        <a
          class="button primary"
          id="open-tailscale"
          href="tailscale://navigate"
          >Apri Tailscale</a
        >
        <button class="button" id="retry" type="button">Riprova</button>
      </div>

      <p class="status" id="status" role="status">Controllo connessione…</p>
      <p class="footnote">
        Se Tailscale non è installato,
        <a href="https://play.google.com/store/apps/details?id=com.tailscale.ipn"
          >scaricalo dal Play Store</a
        >. Su iPhone apri l’app Tailscale manualmente.
      </p>
    </main>
  </body>
</html>
