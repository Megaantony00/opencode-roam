plugins {
    id "com.android.application"
}

android {
    namespace "io.github.opencoderemote.app"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.opencoderemote.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        // Change this to your GitHub "owner/repository" before publishing updates.
        buildConfigField "String", "GITHUB_REPO", "\"Megaantony00/opencode-roam\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
